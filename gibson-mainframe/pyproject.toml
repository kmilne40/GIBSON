[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gibson-mainframe-simulator"
version = "0.5.0"
description = "Gibson IBM mainframe security training simulator refactor"
requires-python = ">=3.10"
dependencies = [
  "passlib>=1.7.4",
  "flask>=3.0",
  "requests>=2.31",
  "rich>=13.0",
  "feedparser>=6.0",
  "httpx>=0.27",
  "psutil>=5.9",
  "websockets>=12",
  "telnetlib3>=2.0; python_version >= '3.13'",
]

[project.optional-dependencies]
# Live EZRecon recon panel needs these on the host running Gibson.
# Also requires the system 'whois' binary (apt-get install whois).
ezrecon-live = [
  "dnspython>=2.6",
  "shodan>=1.31",
  "beautifulsoup4>=4.12",
]

[project.scripts]
gibson = "gibson.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gibson*", "legacy*"]
exclude = ["logs*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
